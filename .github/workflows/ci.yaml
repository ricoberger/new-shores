name: CI

# Cost control: CI runs only when a pull request gets the `ci` label (or on
# manual dispatch). Every run removes the label again, so re-running means
# re-adding the label after pushing new commits. Nothing runs on push.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: server

      - name: golangci-lint (integration and test-only code)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: server
          args: --build-tags integration,testevents

      - name: go vet (integration and test-only code)
        run: go vet -tags 'integration testevents' ./...

      # The full suite (no -short): the long reference games take minutes
      # on a runner, beyond go test's 10-minute default.
      - name: go test
        run: go test -timeout 30m ./...

      - name: Makefile dry-run checks (make up/down)
        working-directory: .
        run: make makefile-test

  client:
    name: client
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Generated palette is up to date
        run: |
          npm run gen:palette
          git diff --exit-code -- src/theme/palette.ts src/theme/palette.css

      - name: Generated HUD icons are up to date
        run: |
          npm run gen:hud-icons
          git diff --exit-code -- src/theme/icons.ts

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build
        run: npm run build

  assets:
    name: assets
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The voxel asset build (assets/voxel) is standard-library Python;
      # the version is pinned so that the drift check compares bytes made
      # by the same interpreter as the committed models.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"

      - name: Asset build tests (Python)
        run: make assets-test

      - name: Asset drift check (rebuild and compare)
        run: make assets-check

  integration:
    name: integration (PostgreSQL + Redis)
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci'
    runs-on: ubuntu-latest
    env:
      CI: "true"
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Go integration tests
        working-directory: server
        run: go test -timeout 30m -tags 'integration testevents' -count=1 ./...

  unlabel:
    name: remove ci label
    if: always() && github.event_name == 'pull_request' && github.event.label.name == 'ci'
    needs: [server, client, assets, integration]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove the ci label so the next run needs a fresh approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --remove-label ci
