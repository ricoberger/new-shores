openapi: 3.0.3
info:
  title: New Shores API
  version: 1.0.0
  description: |
    HTTP API of the New Shores game server (docs/ARCHITECTURE.md §4.4).
    This file is hand-written and is the contract: Go tests validate the
    handlers' requests and responses against it, and the client's types are
    generated from it (`npm run gen:api`).

    Units. All quantities are fixed-point integers; the schema of every
    numeric field states its unit:

    - **milli-units**: goods, 1 unit = 1000 milli-units;
    - **milli-residents**: residents, 1 resident = 1000;
    - **milli-gold**: gold, 1 gold = 1000 milli-gold;
    - **… per minute**: rates are per minute of world time;
    - **permille**: ratios, 1000 = 100 %;
    - **ppm**: ratios in parts per million, 1 000 000 = 100 %;
    - **ms**: durations in milliseconds;
    - **tiles**: tile coordinates, distances and sizes.

    Timestamps are RFC 3339 strings in UTC with millisecond precision.
    JSON field names are snake_case throughout. Objects with fixed fields do
    not allow additional properties; maps keyed by a good, tier or building
    ID are the exception.

    **Authentication.** `/api/v1/world*`, `/api/v1/ws`, `/api/v1/auth/me`
    and `/api/v1/auth/logout` need a session (401 `unauthorized` without a
    valid one); every world request acts on the session player's own world
    (world IDs never come from the client). A session is started by
    `POST /api/v1/auth/guest`, `/register` or `/login` with `transport`:

    - `cookie` (default): the session token is set as the HttpOnly cookie
      `ns_session` (`SameSite=Lax`, `Path=/`, `Secure` when configured) and
      is never in the body; browsers send it with `credentials: "include"`.
    - `bearer`: the token is returned as `session_token` and sent as
      `Authorization: Bearer <token>` (header only, never a query string).

    Sessions expire after 30 days without use (sliding).

    **CSRF.** A request authenticated by the session cookie (no
    `Authorization` header) that is not GET/HEAD/OPTIONS — and every
    `guest`/`register`/`login` request that would set the cookie — must
    prove its origin, else 403 `csrf_rejected`:

    1. an `Origin` header must be one of the server's allowed origins
       (`Origin: null` is rejected);
    2. without `Origin`, `Sec-Fetch-Site: same-origin` or `same-site` is
       accepted (any other value is rejected);
    3. a request that carries neither `Origin` nor an accepted
       `Sec-Fetch-Site` is rejected; `Referer` is not consulted.

    Bearer-authenticated requests are exempt. The WebSocket upgrade
    applies the same rule for cookie sessions.

    **Rate limits.** `guest`, `register`, `login`,
    `password-reset/request` and `verify-email` allow 10 requests per
    minute (burst 10) per client IP and — for `login` and
    `password-reset/request` — per email; beyond that 429 `rate_limited`
    with a `Retry-After` header (seconds).

    **Dev mode** (`server --dev`): no accounts. `/world*` and `/ws` need no
    session, `GET /auth/me` and `POST /auth/guest` answer with the fixed
    player "Developer", `POST /auth/logout` is a no-op (204) and the other
    auth endpoints answer 404 `not_found`.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Readiness probe.
      description: |
        Without `--dev` the server pings PostgreSQL: 503
        `service_unavailable` when it does not answer. Redis is reported in
        the body but does not fail readiness (push and rate limiting
        degrade without it).
      responses:
        "200":
          description: The server is ready.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  version:
                    type: string
                    description: Server build version.
                  instance:
                    type: string
                    description: Instance ID (INSTANCE_ID or the host name); also sent as the X-Instance header.
                  postgres:
                    type: string
                    enum: [ok]
                    description: Database state (default mode only).
                  redis:
                    type: string
                    enum: [ok, unavailable]
                    description: Redis state (default mode only; not fatal).
        "405":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/world:
    get:
      operationId: getWorld
      summary: Advance the world to now and return its display state.
      description: |
        "Now" is the database clock, capped at the earliest due time of a
        pending scheduled event of the world (events are applied by the
        worker at their due time).
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/World"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    options:
      operationId: preflightWorld
      summary: CORS preflight.
      responses:
        "204":
          description: Preflight accepted.
  /api/v1/world/commands:
    post:
      operationId: postCommand
      summary: Advance the world to now and apply one command.
      description: |
        Commands (`command.type`): `place_building`, `place_road`,
        `demolish`, `demolish_road`, `place_field`, `place_fields`,
        `demolish_fields`,
        `set_paused`, `upgrade_building` (deprecated aliases
        `upgrade_house`, `upgrade_trading_post`, `upgrade_warehouse`),
        `move_building`, and the ship and route commands `order_ship`,
        `cancel_ship_order`, `scrap_ship`, `create_route`, `update_route`,
        `delete_route`, `assign_ship`, `unassign_ship`, `manual_shipment`,
        `sail_ship` and `found_island` (MECHANICS §8, §9).

        A new world starts at sea (D-051): no island is settled and the
        start sloop (ship 1) waits at its `position` with the starting
        goods aboard. Settling is `sail_ship` to the chosen island, then
        `found_island` once the ship is idle there; nothing else can be
        placed on an unsettled island (`island_not_settled`).

        On success the version is incremented and the new display state is
        returned. On error the world and its version are unchanged. A
        `version` that differs from the current one is not an error (the
        server state wins); it is only logged. After commit the server
        pushes `world_changed` to the player's sockets (`/api/v1/ws`).
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
      responses:
        "200":
          $ref: "#/components/responses/World"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    options:
      operationId: preflightCommands
      summary: CORS preflight.
      responses:
        "204":
          description: Preflight accepted.
  /api/v1/world/islands/{island_id}/tiles:
    get:
      operationId: getIslandTiles
      summary: Full terrain rows of an island.
      description: |
        The island's terrain at full resolution. The world payload carries
        each island's bounds, fertilities, deposits and a 1:4
        `terrain_mask` only; clients load the rows per island when they
        need them (the island in view first). Terrain changes only with a
        reroll (D-053), so the response is cacheable for good: the `ETag`
        derives from the archipelago's seed and roll and the island ID,
        `Cache-Control` is `private, max-age=31536000, immutable`, and a
        matching `If-None-Match` answers 304. Clients pass the
        archipelago's `<seed>-<roll>` as `v`, so a reroll changes the URL;
        when `v` names another roll than the world's, the response is
        `no-store`. Unsettled islands are served as well.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: island_id
          in: path
          required: true
          schema:
            type: string
        - name: v
          in: query
          required: false
          description: Cache key of the archipelago, `<seed>-<roll>` of `display.archipelago`.
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          description: ETag of a cached response.
          schema:
            type: string
      responses:
        "200":
          description: The island's terrain rows.
          headers:
            ETag:
              description: Strong validator from the archipelago's seed and roll and the island ID.
              schema:
                type: string
            Cache-Control:
              description: "`private, max-age=31536000, immutable`, or `no-store` when `v` names another roll."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IslandTiles"
        "304":
          description: Not modified (If-None-Match matched the ETag).
          headers:
            ETag:
              description: The current validator.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/content:
    get:
      operationId: getContent
      summary: The content catalogue in the units of the display payload.
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"
        "405":
          $ref: "#/components/responses/Error"
    options:
      operationId: preflightContent
      summary: CORS preflight.
      responses:
        "204":
          description: Preflight accepted.
  /api/v1/ws:
    get:
      operationId: getWebSocket
      summary: WebSocket push of world changes.
      description: |
        Upgrades to a WebSocket after authentication (cookie or bearer
        header; cookie sessions must pass the CSRF origin rule). The server
        sends text messages `WorldChangedMessage`
        (`{"type":"world_changed","world_id":"…"}`) after every committed
        change of the player's world — commands from any instance and
        processed scheduled events. Messages carry no game state; clients
        re-fetch `GET /api/v1/world`. The server pings every 25 s and closes
        sockets whose pong does not arrive within 10 s. Without Redis the
        socket stays open but receives no messages.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "101":
          description: Switching protocols (WebSocket).
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v1/auth/guest:
    post:
      operationId: postGuest
      summary: Play as guest.
      description: |
        Without `device_token`: creates a guest player (generated display
        name, e.g. "Settler 4821") with its start world, starts a session
        and returns the new `device_token` (store it; it is the guest's
        only credential). With a valid `device_token`: starts a new session
        for that guest. An unknown or revoked device token (revoked when the
        guest registers) is 401 `invalid_credentials`. Rate limited per IP.
        With `transport: "cookie"` (default) the request must pass the CSRF
        origin rule (allowed `Origin`, or `Sec-Fetch-Site: same-origin` /
        `same-site` without `Origin`; else 403 `csrf_rejected`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestRequest"
      responses:
        "200":
          $ref: "#/components/responses/Auth"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    options:
      operationId: preflightGuest
      summary: CORS preflight.
      responses:
        "204":
          description: Preflight accepted.
  /api/v1/auth/register:
    post:
      operationId: postRegister
      summary: Register with email and password.
      description: |
        With a guest session: sets email and password on the guest, keeps
        its world, revokes its device token and sends a verification mail;
        the session continues (no new session token). Without a session:
        creates a player with a start world, registers it and starts a
        session. A session of a registered player is 409
        `already_registered`; an email in use (case-insensitive) is 409
        `email_taken`; a password outside 8–128 bytes is 400
        `weak_password`; a malformed email or display name is 400
        `bad_request`. Rate limited per IP. A cookie request (or one without
        a session using `transport: "cookie"`) must pass the CSRF origin
        rule (allowed `Origin`, or `Sec-Fetch-Site: same-origin` /
        `same-site` without `Origin`; else 403 `csrf_rejected`).
      security:
        - {}
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          $ref: "#/components/responses/Auth"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          description: Dev mode only (no accounts).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    options:
      operationId: preflightRegister
      summary: CORS preflight.
      responses:
        "204":
          description: Preflight accepted.
  /api/v1/auth/login:
    post:
      operationId: postLogin
      summary: Log in with email and password.
      description: |
        Starts a session (replacing the current one, if any) and updates
        the last login time. Unknown email and wrong password are the same
        401 `invalid_credentials`. Rate limited per IP and per email. With
        `transport: "cookie"` (default) the request must pass the CSRF
        origin rule (allowed `Origin`, or `Sec-Fetch-Site: same-origin` /
        `same-site` without `Origin`; else 403 `csrf_rejected`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/Auth"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          description: Dev mode only (no accounts).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    options:
      operationId: preflightLogin
      summary: CORS preflight.
      responses:
        "204":
          description: Preflight accepted.
  /api/v1/auth/logout:
    post:
      operationId: postLogout
      summary: End the current session.
      description: |
        Deletes the session and clears the session cookie. A cookie request
        must pass the CSRF origin rule (allowed `Origin`, or
        `Sec-Fetch-Site: same-origin` / `same-site` without `Origin`; else
        403 `csrf_rejected`); bearer requests are exempt.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Logged out.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    options:
      operationId: preflightLogout
      summary: CORS preflight.
      responses:
        "204":
          description: Preflight accepted.
  /api/v1/auth/me:
    get:
      operationId: getMe
      summary: The player of the current session.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Auth"
        "401":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    options:
      operationId: preflightMe
      summary: CORS preflight.
      responses:
        "204":
          description: Preflight accepted.
  /api/v1/auth/verify-email:
    post:
      operationId: postVerifyEmail
      summary: Confirm the email address with the token from the mail.
      description: |
        Tokens are single-use and expire after 24 hours; an unknown, used or
        expired token is 400 `invalid_token`. Rate limited per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "204":
          description: Email verified.
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          description: Dev mode only (no accounts).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    options:
      operationId: preflightVerifyEmail
      summary: CORS preflight.
      responses:
        "204":
          description: Preflight accepted.
  /api/v1/auth/password-reset/request:
    post:
      operationId: postPasswordResetRequest
      summary: Request a password reset mail.
      description: |
        Always 204, whether or not the email is registered (no account
        enumeration); a reset mail with a single-use token (1 hour) is sent
        when it is. Rate limited per IP and per email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "204":
          description: Accepted.
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          description: Dev mode only (no accounts).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    options:
      operationId: preflightPasswordResetRequest
      summary: CORS preflight.
      responses:
        "204":
          description: Preflight accepted.
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: postPasswordResetConfirm
      summary: Set a new password with the token from the reset mail.
      description: |
        Sets the new password, consumes the token and ends every session
        of the player. An unknown, used or expired token is 400
        `invalid_token`; a password outside 8–128 bytes is 400
        `weak_password`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "204":
          description: Password changed; all sessions ended.
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          description: Dev mode only (no accounts).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    options:
      operationId: preflightPasswordResetConfirm
      summary: CORS preflight.
      responses:
        "204":
          description: Preflight accepted.
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ns_session
      description: HttpOnly session cookie (transport "cookie"); subject to the CSRF rule.
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token from `session_token` (transport "bearer"); exempt from CSRF.
  responses:
    Auth:
      description: The session's player (and new credentials).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResponse"
    World:
      description: The world's version and display state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorldResponse"
    Error:
      description: Error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    # ------------------------------------------------------------------
    # Envelopes and errors
    # ------------------------------------------------------------------
    WorldResponse:
      type: object
      additionalProperties: false
      required: [version, display]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          description: World version (count of committed commands).
        display:
          $ref: "#/components/schemas/DisplayState"
        tile_results:
          type: array
          description: |
            Per-tile outcome of a batch command (`place_fields`,
            `demolish_fields`, D-054), one entry per request tile in
            request order; absent for every other command.
          items:
            $ref: "#/components/schemas/TileResult"
    TileResult:
      type: object
      additionalProperties: false
      required: [x, y, ok]
      properties:
        x:
          type: integer
          description: Column of the request tile (tiles).
        y:
          type: integer
          description: Row of the request tile (tiles).
        ok:
          type: boolean
          description: The tile was applied (a field placed or demolished).
        reason:
          # Only when `ok` is false: the error code the tile alone would
          # fail with after the accepted tiles (e.g. `occupied`,
          # `field_not_adjacent`, `insufficient_gold`; `field_max_reached`
          # first once the farm is full, as for `place_field`).
          $ref: "#/components/schemas/ErrorCode"
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: Human-readable detail (English; shown verbatim in M1b).
    ErrorCode:
      type: string
      description: |
        Stable error code. HTTP status by class:

        - 400: `bad_request` (malformed JSON, unknown fields, body > 64 KiB,
          missing fields, malformed email or display name),
          `invalid_command` (also more than 8 route stops, 32 load or
          unload entries per stop or 16 cargo entries),
          `unknown_building`, `out_of_bounds`, `invalid_name` (an island
          name that is not 1–24 printable characters after trimming),
          `route_invalid` (route
          rules: 2–8 stops at settled islands, consecutive stops differ,
          known goods without duplicates, whole-unit maximums, name ≤ 40
          characters; or a shipment to an unknown island or the ship's own
          island),
          `invalid_token` (verification or reset token unknown, used or
          expired), `weak_password` (password outside 8–128 bytes);
        - 401: `unauthorized` (no valid session), `invalid_credentials`
          (wrong email or password, unknown or revoked device token);
        - 403: `csrf_rejected` (cookie request without an allowed `Origin`
          or a same-origin/same-site `Sec-Fetch-Site`);
        - 404: `not_found` (unknown endpoint, no world),
          `unknown_island`, `building_not_found`, `ship_not_found`,
          `route_not_found`, `quest_not_found`;
        - 405: `method_not_allowed`;
        - 409: `occupied`, `terrain`, `not_coastal`, `not_on_water` (a
          water-edge building's front rows are not on water, D-051),
          `no_work_area`
          (lumberjack only: no matching tile in its work area; farms with
          fields are placed at 0 fields),
          `no_fertility` (the island lacks the work area's or the field's
          fertility tag),
          `field_type_mismatch` (`place_field` with a type that is not a
          field), `field_not_adjacent` (the field touches neither its farm
          nor one of the farm's active fields), `field_max_reached` (the
          farm owns `fields.max` fields), `field_wrong_farm` (the field
          type belongs to another farm type, or `farm_id` is no farm),
          `field_needs_farm` (`place_building` of a field type: fields are
          placed from their farm with `place_field`),
          `no_deposit` (a deposit building's footprint covers no deposit
          of its kind), `insufficient_gold`, `insufficient_materials`,
          `surplus_loss`, `not_pausable`, `no_road`, `tier_locked`,
          `not_a_house`, `upgrade_unavailable` (also: a Trading Post or
          Warehouse at its last level, or the other upgrade command), `house_not_full`, `needs_unmet`, `upgrade_only` (a house
          of a later tier is only reached by `upgrade_house`),
          `shipyard_busy` (one order at a time), `not_a_shipyard`,
          `unknown_ship_type` (the shipyard cannot build it),
          `no_ship_order`, `ship_not_idle` (the command needs an idle
          ship; scrapping also accepts an anchored one), `ship_not_on_route`,
          `route_in_use` (delete a route with assigned ships),
          `island_already_settled`, `island_not_settled` (placement on an
          island without a Trading Post; found it with a ship),
          `cargo_insufficient` (founding: the cargo lacks the Trading Post
          materials), `cargo_exceeds_slots`, `last_trading_post` (the
          Trading Post of an island with other buildings; roads may stay), `not_connected`
          (a shipyard without a road to the Trading Post or a Warehouse
          cannot order),
          `quest_not_completed`, `quest_already_claimed` (rewards are
          credited once), `reroll_not_allowed` (`reroll_archipelago` after
          an island was settled, while a ship is under way, or on a world
          without a generated archipelago), `email_taken`,
          `already_registered`;
        - 429: `rate_limited` (with `Retry-After` in seconds);
        - 500: `internal`;
        - 503: `service_unavailable` (the database does not answer).

        `move_building` can fail with 400 `bad_request`, `invalid_command`
        (also for a road or an invalid rotation), `out_of_bounds`; 404
        `unknown_island`, `building_not_found`; 409 `occupied`, `terrain`,
        `not_coastal`, `not_on_water`, `no_work_area`, `no_fertility`,
        `no_deposit`. Moving a farm keeps its fields (they may become
        inactive); a field cannot be moved (`invalid_command`). Moving is
        free: it never fails for gold, materials or tier. Placement never
        requires a road (D-042).

        `place_field` (D-051 part 4) is a separate command rather than a
        `farm_id` on `place_building`: its validity depends on a farm
        instance (adjacency chain, maximum, owner) and `place_building`
        stays the free-standing rule set (it refuses fields with
        `field_needs_farm`). It can fail with 400 `bad_request`,
        `invalid_command` (missing field, invalid rotation),
        `out_of_bounds`; 404 `unknown_island`, `unknown_building`,
        `building_not_found` (no such farm); 409 `field_type_mismatch`,
        `field_wrong_farm`, `field_max_reached`, `field_not_adjacent`,
        `tier_locked`, `island_not_settled`, `terrain`, `occupied`,
        `no_fertility`, `insufficient_gold`, `insufficient_materials`.
        Fields are demolished with `demolish` (refund of the field's own
        cost); demolishing a farm demolishes its fields, one refund each.

        `place_fields` and `demolish_fields` (D-054) are the batch forms
        for painted rectangles (at most 512 tiles). Every tile is checked
        with the single-tile rules; the valid ones are applied in one
        state change (one new version) and `tile_results` reports each
        tile. They fail as a whole (world unchanged) with 400
        `bad_request`, `invalid_command` (no tiles, more than 512,
        duplicates, invalid rotation), 404 `unknown_island`,
        `unknown_building`, `building_not_found` (no such farm), 409
        `field_type_mismatch`, `field_wrong_farm`, `tier_locked`,
        `island_not_settled`. A batch without a valid tile is not an
        error: 200 with every tile `ok: false` and its reason, the
        unchanged version, no state change and no event (`place_fields`
        and `demolish_fields` alike).

        `claim_quest` can fail with 400 `bad_request` (missing `quest_id`,
        or no `island_id` for a quest that rewards goods), 404
        `quest_not_found`, `unknown_island`; 409 `quest_not_completed`,
        `quest_already_claimed`, `island_not_settled`. `ack_summary` never
        fails for a well-formed body.

        `reroll_archipelago` (D-053) can fail with 400 `bad_request`; 409
        `reroll_not_allowed`. `rename_island` can fail with 400
        `bad_request`, `invalid_command` (missing field), `invalid_name`;
        404 `unknown_island`; 409 `island_not_settled`.

        `rename_ship` (D-055) can fail with 400 `bad_request`,
        `invalid_command` (missing field), `invalid_name`; 404
        `ship_not_found`.

        **Internal-only codes** (HTTP 500, never caused by a client command;
        clients should treat them like `internal` and not handle them
        specifically): `over_capacity`, `time_backwards`, `schema_version`,
        `display_time`. `schema_version` means a stored world has a schema
        version this server cannot read (no registered migration); the
        world is never reset. `time_backwards` means the database clock is
        before the world's last evaluation.
      enum:
        - bad_request
        - not_found
        - method_not_allowed
        - internal
        - invalid_command
        - unknown_building
        - out_of_bounds
        - unknown_island
        - building_not_found
        - occupied
        - terrain
        - not_coastal
        - not_on_water
        - no_work_area
        - no_fertility
        - no_deposit
        - insufficient_gold
        - insufficient_materials
        - surplus_loss
        - not_pausable
        - no_road
        - tier_locked
        - not_a_house
        - upgrade_unavailable
        - house_not_full
        - needs_unmet
        - upgrade_only
        - route_invalid
        - ship_not_found
        - route_not_found
        - shipyard_busy
        - not_a_shipyard
        - unknown_ship_type
        - no_ship_order
        - ship_not_idle
        - ship_not_on_route
        - route_in_use
        - island_already_settled
        - island_not_settled
        - cargo_insufficient
        - cargo_exceeds_slots
        - last_trading_post
        - not_connected
        - quest_not_found
        - quest_not_completed
        - quest_already_claimed
        - field_type_mismatch
        - field_not_adjacent
        - field_max_reached
        - field_wrong_farm
        - field_needs_farm
        - invalid_name
        - reroll_not_allowed
        - over_capacity
        - time_backwards
        - schema_version
        - display_time
        - unauthorized
        - invalid_credentials
        - csrf_rejected
        - rate_limited
        - email_taken
        - already_registered
        - invalid_token
        - weak_password
        - service_unavailable
    # ------------------------------------------------------------------
    # Accounts and push
    # ------------------------------------------------------------------
    Transport:
      type: string
      enum: [cookie, bearer]
      description: |
        Session transport: `cookie` (default; HttpOnly cookie, token not in
        the body) or `bearer` (token in `session_token`, sent as
        `Authorization: Bearer`).
    Player:
      type: object
      additionalProperties: false
      required: [id, display_name, guest, email_verified]
      properties:
        id:
          type: string
          description: Player ID (UUID; "dev" in dev mode).
        display_name:
          type: string
        guest:
          type: boolean
          description: True until the player registers.
        email:
          type: string
          description: Registered email (lower-cased); only ever returned to its owner.
        email_verified:
          type: boolean
    AuthResponse:
      type: object
      additionalProperties: false
      required: [player]
      properties:
        player:
          $ref: "#/components/schemas/Player"
        device_token:
          type: string
          description: New guest's device token (only when a guest was created; store it).
        session_token:
          type: string
          description: Session token (only with transport "bearer" when a session was started).
    GuestRequest:
      type: object
      additionalProperties: false
      properties:
        device_token:
          type: string
        transport:
          $ref: "#/components/schemas/Transport"
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          description: Trimmed and lower-cased; unique case-insensitively.
        password:
          type: string
          description: 8 to 128 bytes; no composition rules.
        display_name:
          type: string
          description: 1 to 32 printable characters (trimmed); default keeps the guest's or generates one.
        transport:
          $ref: "#/components/schemas/Transport"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        transport:
          $ref: "#/components/schemas/Transport"
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          description: 8 to 128 bytes.
    WorldChangedMessage:
      type: object
      additionalProperties: false
      required: [type, world_id]
      description: WebSocket message of /api/v1/ws (no game state; re-fetch the world).
      properties:
        type:
          type: string
          enum: [world_changed]
        world_id:
          type: string
          description: ID of the changed world (UUID; "dev" in dev mode).
    # ------------------------------------------------------------------
    # Commands
    # ------------------------------------------------------------------
    CommandRequest:
      type: object
      additionalProperties: false
      required: [command]
      properties:
        version:
          type: integer
          format: int64
          description: World version the client last saw (optional; a mismatch is only logged).
        command:
          $ref: "#/components/schemas/Command"
    Command:
      oneOf:
        - $ref: "#/components/schemas/PlaceBuildingCommand"
        - $ref: "#/components/schemas/PlaceRoadCommand"
        - $ref: "#/components/schemas/DemolishCommand"
        - $ref: "#/components/schemas/DemolishRoadCommand"
        - $ref: "#/components/schemas/PlaceFieldCommand"
        - $ref: "#/components/schemas/PlaceFieldsCommand"
        - $ref: "#/components/schemas/DemolishFieldsCommand"
        - $ref: "#/components/schemas/SetPausedCommand"
        - $ref: "#/components/schemas/UpgradeHouseCommand"
        - $ref: "#/components/schemas/UpgradeBuildingCommand"
        - $ref: "#/components/schemas/UpgradeWarehouseCommand"
        - $ref: "#/components/schemas/UpgradeTradingPostCommand"
        - $ref: "#/components/schemas/MoveBuildingCommand"
        - $ref: "#/components/schemas/OrderShipCommand"
        - $ref: "#/components/schemas/CancelShipOrderCommand"
        - $ref: "#/components/schemas/ScrapShipCommand"
        - $ref: "#/components/schemas/CreateRouteCommand"
        - $ref: "#/components/schemas/UpdateRouteCommand"
        - $ref: "#/components/schemas/DeleteRouteCommand"
        - $ref: "#/components/schemas/AssignShipCommand"
        - $ref: "#/components/schemas/UnassignShipCommand"
        - $ref: "#/components/schemas/ManualShipmentCommand"
        - $ref: "#/components/schemas/SailShipCommand"
        - $ref: "#/components/schemas/FoundIslandCommand"
        - $ref: "#/components/schemas/ClaimQuestCommand"
        - $ref: "#/components/schemas/AckSummaryCommand"
        - $ref: "#/components/schemas/RerollArchipelagoCommand"
        - $ref: "#/components/schemas/RenameIslandCommand"
        - $ref: "#/components/schemas/RenameShipCommand"
      discriminator:
        propertyName: type
        mapping:
          place_building: "#/components/schemas/PlaceBuildingCommand"
          place_road: "#/components/schemas/PlaceRoadCommand"
          demolish: "#/components/schemas/DemolishCommand"
          demolish_road: "#/components/schemas/DemolishRoadCommand"
          place_field: "#/components/schemas/PlaceFieldCommand"
          place_fields: "#/components/schemas/PlaceFieldsCommand"
          demolish_fields: "#/components/schemas/DemolishFieldsCommand"
          set_paused: "#/components/schemas/SetPausedCommand"
          upgrade_house: "#/components/schemas/UpgradeHouseCommand"
          upgrade_building: "#/components/schemas/UpgradeBuildingCommand"
          upgrade_warehouse: "#/components/schemas/UpgradeWarehouseCommand"
          upgrade_trading_post: "#/components/schemas/UpgradeTradingPostCommand"
          move_building: "#/components/schemas/MoveBuildingCommand"
          order_ship: "#/components/schemas/OrderShipCommand"
          cancel_ship_order: "#/components/schemas/CancelShipOrderCommand"
          scrap_ship: "#/components/schemas/ScrapShipCommand"
          create_route: "#/components/schemas/CreateRouteCommand"
          update_route: "#/components/schemas/UpdateRouteCommand"
          delete_route: "#/components/schemas/DeleteRouteCommand"
          assign_ship: "#/components/schemas/AssignShipCommand"
          unassign_ship: "#/components/schemas/UnassignShipCommand"
          manual_shipment: "#/components/schemas/ManualShipmentCommand"
          sail_ship: "#/components/schemas/SailShipCommand"
          found_island: "#/components/schemas/FoundIslandCommand"
          claim_quest: "#/components/schemas/ClaimQuestCommand"
          ack_summary: "#/components/schemas/AckSummaryCommand"
          reroll_archipelago: "#/components/schemas/RerollArchipelagoCommand"
          rename_island: "#/components/schemas/RenameIslandCommand"
          rename_ship: "#/components/schemas/RenameShipCommand"
    ClaimQuestCommand:
      type: object
      additionalProperties: false
      description: |
        Credit the rewards of a completed quest once: gold to the world,
        goods to the island `island_id`, clamped to its free capacity
        (capacity − stock − in transit); the excess is lost.
      required: [type, quest_id]
      properties:
        type:
          type: string
          enum: [claim_quest]
        quest_id:
          type: string
          description: Content quest ID.
        island_id:
          type: string
          description: Settled island that receives reward goods; required when the quest rewards goods, optional (validated when set) otherwise.
    AckSummaryCommand:
      type: object
      additionalProperties: false
      description: |
        Acknowledge the pending "while you were away" summary. Clears it
        when `summary_id` matches its `id`; otherwise nothing changes.
        Like every command it marks the player as seen (`last_seen_at`).
      required: [type, summary_id]
      properties:
        type:
          type: string
          enum: [ack_summary]
        summary_id:
          type: integer
          format: int64
          description: The `id` of the summary (its end time in Unix milliseconds).
    RerollArchipelagoCommand:
      type: object
      additionalProperties: false
      description: |
        Replace the generated archipelago by the next one of the world's
        seed (D-053; `archipelago.roll` + 1): new islands under the same
        IDs, every ship back at the new spawn near the centre with its
        cargo. Only while `archipelago.rerollable`: no island settled and
        no ship under way.
      required: [type]
      properties:
        type:
          type: string
          enum: [reroll_archipelago]
    RenameIslandCommand:
      type: object
      additionalProperties: false
      description: |
        Rename a settled island. The name is trimmed and must then have 1
        to 24 printable characters (`invalid_name`).
      required: [type, island_id, name]
      properties:
        type:
          type: string
          enum: [rename_island]
        island_id:
          type: string
        name:
          type: string
          description: The new display name.
    RenameShipCommand:
      type: object
      additionalProperties: false
      description: |
        Rename a ship in any state (D-055). The name is trimmed; an empty
        name restores the default ("<ship type name> <id>"), any other must
        have 1 to 24 printable characters (`invalid_name`).
      required: [type, ship_id, name]
      properties:
        type:
          type: string
          enum: [rename_ship]
        ship_id:
          type: integer
          format: int64
          description: Ship ID (unscaled integer identifier, from ShipDisplay.id).
        name:
          type: string
          description: The new name (empty restores the default).
    Tile:
      type: object
      additionalProperties: false
      required: [x, y]
      properties:
        x:
          type: integer
          description: Column (tiles).
        y:
          type: integer
          description: Row (tiles).
    TileList:
      type: array
      description: Tiles; at most the island area (width × height).
      items:
        $ref: "#/components/schemas/Tile"
    PlaceBuildingCommand:
      type: object
      additionalProperties: false
      required: [type, island_id, building_type, x, y, rotation]
      properties:
        type:
          type: string
          enum: [place_building]
        island_id:
          type: string
        building_type:
          type: string
          description: Content building ID.
        x:
          type: integer
          description: Left column of the rotated footprint (tiles).
        y:
          type: integer
          description: Top row of the rotated footprint (tiles).
        rotation:
          type: integer
          enum: [0, 90, 180, 270]
          description: Degrees; 90 and 270 swap width and height.
    PlaceRoadCommand:
      type: object
      additionalProperties: false
      required: [type, island_id, road_type, tiles]
      properties:
        type:
          type: string
          enum: [place_road]
        island_id:
          type: string
        road_type:
          type: string
          description: Content building ID with a road block.
        tiles:
          $ref: "#/components/schemas/TileList"
    DemolishCommand:
      type: object
      additionalProperties: false
      required: [type, island_id, building_id]
      properties:
        type:
          type: string
          enum: [demolish]
        island_id:
          type: string
        building_id:
          type: integer
          format: int64
          description: Building ID (unscaled integer identifier, from BuildingDisplay.id).
        accept_surplus_loss:
          type: boolean
          default: false
          description: Accept losing goods above the remaining capacity (answer to `surplus_loss`).
    DemolishRoadCommand:
      type: object
      additionalProperties: false
      required: [type, island_id, tiles]
      properties:
        type:
          type: string
          enum: [demolish_road]
        island_id:
          type: string
        tiles:
          $ref: "#/components/schemas/TileList"
    PlaceFieldCommand:
      type: object
      additionalProperties: false
      description: |
        Place one field of `building_type` from the farm `farm_id` at
        (`x`, `y`), the top-left tile of the rotated footprint (D-051
        part 4). The footprint (the field type's content footprint) must be
        on the island, on the field's terrain, free of buildings and
        roads, on an island with the field's fertility and 4-edge adjacent
        (sharing an edge segment, not only a corner) to the farm or to one of the farm's active
        fields; the farm may own at most `fields.max` fields. The field's
        cost is charged. The client sends only placements its display data
        shows as valid and treats a rejection as stale data.
      required: [type, island_id, farm_id, building_type, x, y]
      properties:
        type:
          type: string
          enum: [place_field]
        island_id:
          type: string
        farm_id:
          type: integer
          format: int64
          description: Building ID of the owning farm (BuildingDisplay.id).
        building_type:
          type: string
          description: Content building ID with a field block whose `field.farm` is the farm's type.
        x:
          type: integer
          description: Left column of the rotated footprint (tiles).
        y:
          type: integer
          description: Top row of the rotated footprint (tiles).
        rotation:
          type: integer
          enum: [0, 90, 180, 270]
          description: Optional, default 0.
    FieldTileList:
      type: array
      minItems: 1
      maxItems: 512
      description: Tiles of a field batch, without duplicates.
      items:
        $ref: "#/components/schemas/Tile"
    PlaceFieldsCommand:
      type: object
      additionalProperties: false
      description: |
        Place fields of `building_type` from the farm `farm_id` at every
        valid anchor of `tiles` (D-054 painting): each tile is the
        top-left tile of one field footprint (a 1×1 crop field: the tile
        itself) and is checked with the rules of `place_field` against
        the island plus the fields accepted before it, the cost
        cumulatively (a tile is valid only while gold and materials cover
        it). The tiles are taken in order, in passes repeated while one
        accepts a tile, so a rectangle grows from the farm whatever its
        order; placement stops at the farm's `fields.max`. The valid
        tiles are placed in one state change; `tile_results` reports
        every tile. Without a valid tile the command answers 200 with
        every tile rejected and the unchanged version (no state change,
        no event).
      required: [type, island_id, farm_id, building_type, tiles]
      properties:
        type:
          type: string
          enum: [place_fields]
        island_id:
          type: string
        farm_id:
          type: integer
          format: int64
          description: Building ID of the owning farm (BuildingDisplay.id).
        building_type:
          type: string
          description: Content building ID with a field block whose `field.farm` is the farm's type.
        tiles:
          $ref: "#/components/schemas/FieldTileList"
        rotation:
          type: integer
          enum: [0, 90, 180, 270]
          description: Optional, default 0; applies to every field.
    DemolishFieldsCommand:
      type: object
      additionalProperties: false
      description: |
        Demolish the fields of the farm `farm_id` covering `tiles`
        (D-054): each field once, however many of its tiles are listed,
        with the refund of its own cost (50 % of the materials, rounded
        down, no gold). A tile without a field of the farm is rejected
        (`building_not_found`, or `out_of_bounds`). The valid tiles are
        applied in one state change; `tile_results` reports every tile.
        Without a valid tile (a rectangle over no field of the farm) it
        succeeds like `place_fields`: 200, every tile `ok: false`, the
        unchanged version, no event.
      required: [type, island_id, farm_id, tiles]
      properties:
        type:
          type: string
          enum: [demolish_fields]
        island_id:
          type: string
        farm_id:
          type: integer
          format: int64
          description: Building ID of the owning farm (BuildingDisplay.id).
        tiles:
          $ref: "#/components/schemas/FieldTileList"
    SetPausedCommand:
      type: object
      additionalProperties: false
      required: [type, island_id, building_id, paused]
      properties:
        type:
          type: string
          enum: [set_paused]
        island_id:
          type: string
        building_id:
          type: integer
          format: int64
          description: Building ID (unscaled integer identifier, from BuildingDisplay.id).
        paused:
          type: boolean
    UpgradeBuildingCommand:
      type: object
      additionalProperties: false
      description: |
        Upgrade a building (D-056): a full house to the next tier's house
        (as `upgrade_house`); a Trading Post, Warehouse or public building
        with service levels (`market_small`) to its next level — the
        level's `cost` is charged like a placement and a level with a
        `tier` needs that tier unlocked (`tier_locked`).
        `upgrade_unavailable` for a building without a next level.
        `upgrade_house`, `upgrade_warehouse` and `upgrade_trading_post`
        are deprecated aliases (the latter two keep their building-kind
        check).
      required: [type, island_id, building_id]
      properties:
        type:
          type: string
          enum: [upgrade_building]
        island_id:
          type: string
        building_id:
          type: integer
          format: int64
          description: Building ID (unscaled integer identifier, from BuildingDisplay.id).
    UpgradeHouseCommand:
      type: object
      additionalProperties: false
      description: Deprecated alias of `upgrade_building` for houses.
      required: [type, island_id, building_id]
      properties:
        type:
          type: string
          enum: [upgrade_house]
        island_id:
          type: string
        building_id:
          type: integer
          format: int64
          description: Building ID (unscaled integer identifier, from BuildingDisplay.id).
    UpgradeWarehouseCommand:
      type: object
      additionalProperties: false
      description: |
        Raise a Warehouse (inland collector, D-051) to its next level
        (MECHANICS §5): the next level's `cost` (content
        `warehouse.levels[i].cost`) is charged like a placement (gold from
        the world, materials from the island); its throughput changes at
        once. `upgrade_unavailable` for every other building (the Trading
        Post has `upgrade_trading_post`) and at the last level. Deprecated
        alias of `upgrade_building`.
      required: [type, island_id, building_id]
      properties:
        type:
          type: string
          enum: [upgrade_warehouse]
        island_id:
          type: string
        building_id:
          type: integer
          format: int64
          description: Building ID (unscaled integer identifier, from BuildingDisplay.id).
    UpgradeTradingPostCommand:
      type: object
      additionalProperties: false
      description: |
        Raise the island's Trading Post (D-051) to its next level
        (MECHANICS §5, §9.3): the next level's `cost` (content
        `trading_post.levels[i].cost`) is charged like a placement;
        capacity, throughput and berths change at once (ships waiting for
        a berth may be granted one at once). `upgrade_unavailable` for
        every other building and at the last level. Deprecated alias of
        `upgrade_building`.
      required: [type, island_id, building_id]
      properties:
        type:
          type: string
          enum: [upgrade_trading_post]
        island_id:
          type: string
        building_id:
          type: integer
          format: int64
          description: Building ID (unscaled integer identifier, from BuildingDisplay.id).
    MoveBuildingCommand:
      type: object
      additionalProperties: false
      description: |
        Move a building (not a road) to another valid position on the same
        island, free of charge (D-042). The building keeps its ID and state;
        goods in transit keep arriving. Its own current footprint counts as
        free, so a one-tile shift is valid; the identical position is a
        valid no-op.
      required: [type, island_id, building_id, x, y, rotation]
      properties:
        type:
          type: string
          enum: [move_building]
        island_id:
          type: string
        building_id:
          type: integer
          format: int64
          description: Building ID (unscaled integer identifier, from BuildingDisplay.id).
        x:
          type: integer
          description: Left column of the rotated footprint at the target (tiles).
        y:
          type: integer
          description: Top row of the rotated footprint at the target (tiles).
        rotation:
          type: integer
          enum: [0, 90, 180, 270]
          description: Degrees; 90 and 270 swap width and height. Visual only.
    OrderShipCommand:
      type: object
      additionalProperties: false
      description: |
        Order a ship at a shipyard (a building with a `shipyard` block that
        lists the ship type). The shipyard must be road-connected to the
        Trading Post or a Warehouse and idle; the cost (gold from the world, materials from
        the shipyard's island) is deducted at once. The ship appears idle at
        the shipyard's island at the order's `due_at` (ship_built).
      required: [type, island_id, building_id, ship_type]
      properties:
        type:
          type: string
          enum: [order_ship]
        island_id:
          type: string
        building_id:
          type: integer
          format: int64
          description: Building ID of the shipyard (unscaled integer identifier, from BuildingDisplay.id).
        ship_type:
          type: string
          description: Content ship ID (e.g. sloop).
    CancelShipOrderCommand:
      type: object
      additionalProperties: false
      description: Cancel a shipyard's pending order; 50 % of each material is refunded (whole units, clamped to capacity), no gold.
      required: [type, island_id, building_id]
      properties:
        type:
          type: string
          enum: [cancel_ship_order]
        island_id:
          type: string
        building_id:
          type: integer
          format: int64
          description: Building ID of the shipyard (unscaled integer identifier, from BuildingDisplay.id).
    ScrapShipCommand:
      type: object
      additionalProperties: false
      description: |
        Scrap an idle or anchored ship: its cargo is unloaded into its
        island (above capacity it is lost), 50 % of the ship's materials are
        refunded (whole units, clamped), no gold.
      required: [type, ship_id]
      properties:
        type:
          type: string
          enum: [scrap_ship]
        ship_id:
          type: integer
          format: int64
          description: Ship ID (unscaled integer identifier, from ShipDisplay.id).
    RouteStop:
      type: object
      additionalProperties: false
      description: |
        A route stop. At the stop the ship first unloads the `unload` goods
        (limited by free capacity; the rest stays aboard), then loads the
        `load` goods.
      required: [island_id, load, unload]
      properties:
        island_id:
          type: string
        load:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/LoadRule"
        unload:
          type: array
          maxItems: 32
          description: Goods to unload (content good IDs).
          items:
            type: string
    LoadRule:
      type: object
      additionalProperties: false
      required: [good, max_amount]
      properties:
        good:
          type: string
        max_amount:
          type: integer
          format: int64
          description: Load until this amount of the good is aboard (top up to), in milli-units; a whole number of units > 0.
    CreateRouteCommand:
      type: object
      additionalProperties: false
      description: |
        Create a route: 2–8 stops at settled islands, consecutive stops
        (including last → first) at different islands. The name is trimmed
        of surrounding whitespace; an empty, whitespace-only or missing
        name becomes "Route <id>".
      required: [type, stops]
      properties:
        type:
          type: string
          enum: [create_route]
        name:
          type: string
          maxLength: 40
        stops:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/RouteStop"
    UpdateRouteCommand:
      type: object
      additionalProperties: false
      description: |
        Replace a route's name and stops. Allowed while ships are assigned:
        they finish their current leg and resolve their stop at arrival
        (the stop they head to if it is at the arrival island, else the
        first stop there, else they sail to stop 0). The name follows
        create_route's rules (trimmed; empty becomes "Route <id>").
      required: [type, route_id, stops]
      properties:
        type:
          type: string
          enum: [update_route]
        route_id:
          type: integer
          format: int64
          description: Route ID (unscaled integer identifier, from RouteDisplay.id).
        name:
          type: string
          maxLength: 40
        stops:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/RouteStop"
    DeleteRouteCommand:
      type: object
      additionalProperties: false
      description: Delete a route without assigned ships (`route_in_use` otherwise).
      required: [type, route_id]
      properties:
        type:
          type: string
          enum: [delete_route]
        route_id:
          type: integer
          format: int64
          description: Route ID (unscaled integer identifier, from RouteDisplay.id).
    AssignShipCommand:
      type: object
      additionalProperties: false
      description: |
        Assign an idle ship to a route. At a stop's island the ship handles
        that stop (first occurrence) at once and departs after the handling
        time; elsewhere it sails to stop 0 at once.
      required: [type, ship_id, route_id]
      properties:
        type:
          type: string
          enum: [assign_ship]
        ship_id:
          type: integer
          format: int64
          description: Ship ID (unscaled integer identifier, from ShipDisplay.id).
        route_id:
          type: integer
          format: int64
          description: Route ID (unscaled integer identifier, from RouteDisplay.id).
    UnassignShipCommand:
      type: object
      additionalProperties: false
      description: |
        Remove a ship from its route. A ship on a leg finishes it as a
        manual leg (unloads everything at arrival and ends idle); an
        anchored ship stays anchored.
      required: [type, ship_id]
      properties:
        type:
          type: string
          enum: [unassign_ship]
        ship_id:
          type: integer
          format: int64
          description: Ship ID (unscaled integer identifier, from ShipDisplay.id).
    CargoEntry:
      type: object
      additionalProperties: false
      required: [good, amount]
      properties:
        good:
          type: string
        amount:
          type: integer
          format: int64
          description: Amount to load (milli-units, > 0).
    ManualShipmentCommand:
      type: object
      additionalProperties: false
      description: |
        Send an idle ship from its island to another island (settled or
        not). The cargo leaves the island's stock now and, together with
        what is already aboard, must fit the slots; the list may be empty
        when cargo is aboard. The ship departs after the handling time; at
        arrival it unloads everything that fits and ends idle.
      required: [type, ship_id, to_island_id, cargo]
      properties:
        type:
          type: string
          enum: [manual_shipment]
        ship_id:
          type: integer
          format: int64
          description: Ship ID (unscaled integer identifier, from ShipDisplay.id).
        to_island_id:
          type: string
        cargo:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/CargoEntry"
    SailShipCommand:
      type: object
      additionalProperties: false
      description: |
        Send an idle ship with its cargo (nothing is loaded) from its island
        or from its sea position (the start ship of a new world, D-051) to
        another island; it departs at once. At arrival it unloads like a
        manual shipment at a settled island (queueing for a berth); at an
        unsettled island everything stays aboard and the ship is idle
        there, ready for `found_island`. Errors: `ship_not_found`,
        `ship_not_idle`, `route_invalid` (unknown destination or the
        ship's own island).
      required: [type, ship_id, to_island_id]
      properties:
        type:
          type: string
          enum: [sail_ship]
        ship_id:
          type: integer
          format: int64
          description: Ship ID (unscaled integer identifier, from ShipDisplay.id).
        to_island_id:
          type: string
    FoundIslandCommand:
      type: object
      additionalProperties: false
      description: |
        Settle an unsettled island (D-051): an idle ship there pays the
        Trading Post's materials from its cargo (gold from the world) and
        the Trading Post (`building_type` with a `trading_post` block) is
        placed with its front rows over the water (`not_on_water`
        otherwise); the remaining cargo is unloaded (up to capacity). The
        Trading Post is never placed by `place_building`.
      required: [type, ship_id, island_id, building_type, x, y, rotation]
      properties:
        type:
          type: string
          enum: [found_island]
        ship_id:
          type: integer
          format: int64
          description: Ship ID (unscaled integer identifier, from ShipDisplay.id).
        island_id:
          type: string
        building_type:
          type: string
          description: Content building ID with a `trading_post` block (the Trading Post).
        x:
          type: integer
          description: Left column of the rotated footprint (tiles).
        y:
          type: integer
          description: Top row of the rotated footprint (tiles).
        rotation:
          type: integer
          enum: [0, 90, 180, 270]
          description: Degrees; 90 and 270 swap width and height.
    # ------------------------------------------------------------------
    # Island tiles (static terrain rows)
    # ------------------------------------------------------------------
    IslandTiles:
      type: object
      additionalProperties: false
      required: [id, width, height, revision, terrain]
      properties:
        id:
          type: string
        width:
          type: integer
          description: Columns (tiles).
        height:
          type: integer
          description: Rows (tiles).
        revision:
          type: string
          description: |
            Identity of the static island data (decoration seeds): the
            world's content version and, for a generated archipelago
            (D-053), its seed and roll.
        terrain:
          type: array
          description: Terrain ID per tile, row-major (index = y × width + x).
          items:
            type: string
            enum: [water, coast, grass, forest, mountain]
    DepositDisplay:
      type: object
      additionalProperties: false
      required: [x, y, kind]
      description: A tile carrying a deposit (infinite, D-036).
      properties:
        x:
          type: integer
          description: Column (tiles).
        y:
          type: integer
          description: Row (tiles).
        kind:
          type: string
          description: Deposit kind, e.g. stone or iron.
    # ------------------------------------------------------------------
    # Display payload (sim.DisplayState)
    # ------------------------------------------------------------------
    DisplayState:
      type: object
      additionalProperties: false
      description: |
        Authoritative state at `evaluated_at` plus the rates the client
        extrapolates linearly until `next_change_at` (D-027).
      required:
        [evaluated_at, next_change_at, gold, balance_rate_per_min, tax_rate_per_min, upkeep_rate_per_min, tiers, archipelago, islands, ships, routes, insolvency, quests, away_summary, last_seen_at]
      properties:
        evaluated_at:
          type: string
          description: World time of this state (RFC 3339, UTC, ms).
        next_change_at:
          type: string
          nullable: true
          description: Earliest time the state changes without a command — rates, ship arrivals, departures and completed ship orders (RFC 3339, UTC, ms); null if never.
        gold:
          type: integer
          format: int64
          minimum: 0
          description: Gold (milli-gold).
        balance_rate_per_min:
          type: integer
          format: int64
          description: Net gold rate, taxes minus upkeep (milli-gold per minute, signed).
        tax_rate_per_min:
          type: integer
          format: int64
          description: Taxes (milli-gold per minute).
        upkeep_rate_per_min:
          type: integer
          format: int64
          description: Upkeep of non-paused buildings and ships (milli-gold per minute).
        tiers:
          type: array
          description: Tiers in progression order.
          items:
            $ref: "#/components/schemas/TierDisplay"
        archipelago:
          $ref: "#/components/schemas/ArchipelagoDisplay"
        islands:
          type: array
          items:
            $ref: "#/components/schemas/IslandDisplay"
        ships:
          type: array
          description: Ships by ascending ID.
          items:
            $ref: "#/components/schemas/ShipDisplay"
        routes:
          type: array
          description: Routes by ascending ID.
          items:
            $ref: "#/components/schemas/RouteDisplay"
        insolvency:
          $ref: "#/components/schemas/InsolvencyDisplay"
        quests:
          $ref: "#/components/schemas/QuestsDisplay"
        away_summary:
          description: The pending "while you were away" summary, null when none. The client shows it once per `id` and acknowledges it with `ack_summary`.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AwaySummary"
        last_seen_at:
          type: string
          description: World time of the player's last successful command (RFC 3339, UTC, ms); initially the world's creation. Reads and scheduled events do not change it.
    QuestsDisplay:
      type: object
      additionalProperties: false
      description: Quest state derived from the world (content order unless stated).
      required: [active, claimable, completed]
      properties:
        active:
          type: array
          description: Active quests (prerequisites completed, not completed themselves).
          items:
            $ref: "#/components/schemas/ActiveQuestDisplay"
        claimable:
          type: array
          description: IDs of completed quests whose rewards were not claimed yet.
          items:
            type: string
        completed:
          type: array
          description: Every completed quest, by completion time, then content order.
          items:
            $ref: "#/components/schemas/CompletedQuestDisplay"
    ActiveQuestDisplay:
      type: object
      additionalProperties: false
      required: [id, objectives]
      properties:
        id:
          type: string
          description: Content quest ID.
        objectives:
          type: array
          description: Progress of the quest's objectives in content order.
          items:
            $ref: "#/components/schemas/ObjectiveDisplay"
    ObjectiveDisplay:
      type: object
      additionalProperties: false
      description: |
        Progress of one objective. `current` and `target` are in the
        predicate's unit: counts for `building_count` (road tiles for a road
        type), `island_settled` and `ship_count`; 0/1 for `connected`,
        `route_exists` and `tier_unlocked`; milli-residents for
        `population`; milli-units of stock for `stock`; per-mille for
        `satisfaction` (current −1 while the tier has no house).
      required: [kind, current, target, met]
      properties:
        kind:
          type: string
          enum: [building_count, connected, population, stock, route_exists, island_settled, tier_unlocked, ship_count, satisfaction]
        type:
          type: string
          description: Content building ID (building_count, connected).
        good:
          type: string
          description: Good ID (stock).
        tier:
          type: string
          description: Tier ID (population, tier_unlocked, satisfaction).
        island:
          type: string
          description: Island the objective is restricted to (absent = archipelago).
        current:
          type: integer
          format: int64
          description: Current value in the objective's unit (see the schema description).
        target:
          type: integer
          format: int64
          description: Target value in the objective's unit (see the schema description).
        met:
          type: boolean
    CompletedQuestDisplay:
      type: object
      additionalProperties: false
      required: [id, completed_at, claimed]
      properties:
        id:
          type: string
          description: Content quest ID.
        completed_at:
          type: string
          description: Completion time (RFC 3339, UTC, ms).
        claimed:
          type: boolean
          description: Whether the rewards were claimed.
    AwaySummary:
      type: object
      additionalProperties: false
      description: |
        "While you were away" summary over [`from`, `to`]: from the player's
        last command to the request that produced it. Produced on `GET
        /world` or a command when at least `away_summary_ms` passed since
        `last_seen_at` and no summary is pending (or the pending one ended
        at least that long ago; the new one replaces it). The interval
        includes the command that produced it: `gold_before` and
        `population.*.before` are the values at `from`. Goods in
        milli-units, gold in milli-gold, residents in milli-residents.
      required: [id, from, to, gold_before, gold_after, population, islands, auto_paused, auto_resumed, still_unpaid, ships_arrived, arrivals, quests_completed]
      properties:
        id:
          type: integer
          format: int64
          description: Summary ID (its `to` in Unix milliseconds); acknowledge with `ack_summary`.
        from:
          type: string
          description: Start of the interval, the last command (RFC 3339, UTC, ms).
        to:
          type: string
          description: End of the interval (RFC 3339, UTC, ms).
        gold_before:
          type: integer
          format: int64
          minimum: 0
          description: Gold at `from` (milli-gold).
        gold_after:
          type: integer
          format: int64
          minimum: 0
          description: Gold at `to` (milli-gold).
        population:
          type: object
          description: Residents per tier over the archipelago at `from` and `to`.
          additionalProperties:
            $ref: "#/components/schemas/AwayPopulation"
        islands:
          type: array
          description: Islands in world order.
          items:
            $ref: "#/components/schemas/AwayIsland"
        auto_paused:
          type: integer
          minimum: 0
          description: Buildings and ships paused for insolvency during the interval (count of pauses).
        auto_resumed:
          type: integer
          minimum: 0
          description: Buildings and ships resumed automatically during the interval (count of resumes).
        still_unpaid:
          type: array
          description: Buildings and ships still paused for insolvency at `to`.
          items:
            $ref: "#/components/schemas/AwayUnpaid"
        ships_arrived:
          type: integer
          minimum: 0
          description: Ship arrivals during the interval (count).
        arrivals:
          type: array
          description: Every ship arrival of the interval in time order (`ships_arrived` entries).
          items:
            $ref: "#/components/schemas/AwayArrival"
        quests_completed:
          type: array
          description: Quests completed during the interval, by completion time.
          items:
            $ref: "#/components/schemas/AwayQuest"
    AwayPopulation:
      type: object
      additionalProperties: false
      required: [before, after]
      properties:
        before:
          type: integer
          format: int64
          description: Residents at `from` (milli-residents).
        after:
          type: integer
          format: int64
          description: Residents at `to` (milli-residents).
    AwayIsland:
      type: object
      additionalProperties: false
      required: [id, goods]
      properties:
        id:
          type: string
        goods:
          type: object
          description: Every good with a flow during the interval or stock at `to`.
          additionalProperties:
            $ref: "#/components/schemas/AwayGood"
    AwayGood:
      type: object
      additionalProperties: false
      required: [produced, consumed, lost, stock_after, capacity, at_capacity]
      properties:
        produced:
          type: integer
          format: int64
          description: Produced during the interval (milli-units).
        consumed:
          type: integer
          format: int64
          description: Consumed during the interval (milli-units).
        lost:
          type: integer
          format: int64
          description: Lost to capacity clamping during the interval (milli-units).
        stock_after:
          type: integer
          format: int64
          description: Stock at `to` (milli-units).
        capacity:
          type: integer
          format: int64
          description: Capacity of the good on the island at `to` (milli-units).
        at_capacity:
          type: boolean
          description: The good is full at `to` (full regime, or stock plus in-transit equals the capacity).
    AwayUnpaid:
      type: object
      additionalProperties: false
      required: [island_id, type]
      properties:
        island_id:
          type: string
          description: Island of the building or ship (empty for a ship at sea).
        building_id:
          type: integer
          format: int64
          description: Building ID (absent for a ship).
        ship_id:
          type: integer
          format: int64
          description: Ship ID (absent for a building).
        type:
          type: string
          description: Content building or ship type.
    AwayArrival:
      type: object
      additionalProperties: false
      required: [ship_id, island_id, at]
      properties:
        ship_id:
          type: integer
          format: int64
          description: Ship ID.
        island_id:
          type: string
        at:
          type: string
          description: Arrival time (RFC 3339, UTC, ms).
    AwayQuest:
      type: object
      additionalProperties: false
      required: [id, completed_at]
      properties:
        id:
          type: string
          description: Content quest ID.
        completed_at:
          type: string
          description: Completion time (RFC 3339, UTC, ms).
    InsolvencyDisplay:
      type: object
      additionalProperties: false
      description: |
        Buildings and ships paused for insolvency (MECHANICS §7) and the
        balance with all of them running, for the HUD banner. The client
        shows the banner when `unpaid_buildings + unpaid_ships > 0`.
      required: [unpaid_buildings, unpaid_ships, unpaid_upkeep_per_min, balance_if_resumed_per_min]
      properties:
        unpaid_buildings:
          type: integer
          minimum: 0
          description: Number of buildings paused for insolvency (count).
        unpaid_ships:
          type: integer
          minimum: 0
          description: Number of ships paused for insolvency (count).
        unpaid_upkeep_per_min:
          type: integer
          format: int64
          minimum: 0
          description: Summed upkeep of everything paused for insolvency (milli-gold per minute).
        balance_if_resumed_per_min:
          type: integer
          format: int64
          description: |
            Full balance with every unpaid building and ship running and
            all rates recomputed as for an auto-resume, MECHANICS §7 (b)
            (milli-gold per minute, signed); the current balance when
            nothing is unpaid.
    ShipDisplay:
      type: object
      additionalProperties: false
      description: |
        A ship. `state`: `idle` (at `island_id`), `on_route`, `manual_leg`
        (both with a `leg`; `manual_leg` without a leg while unloading at a
        berth after a manual leg, until `berth_until`),
        `waiting_for_berth` (queued at `island_id`'s Trading Post since
        `queued_at`, D-051: the arrival's unloading and loading wait for a
        free berth), `anchored_unpaid` (paused for insolvency at
        `island_id`; on a leg it anchors at arrival); `on_world_map` is
        reserved. While handling cargo before `leg.depart_at` the ship is
        at the leg's origin, holding a berth until `berth_until`;
        afterwards `island_id` is empty.
      required: [id, type, name, state, island_id, route_id, stop_index, leg, cargo, slots, slot_size, upkeep_per_min, paused, paused_reason, position, queued_at, berth_until]
      properties:
        id:
          type: integer
          format: int64
          description: Ship ID (unscaled integer identifier, unique per world, assigned sequentially).
        type:
          type: string
          description: Content ship ID.
        name:
          type: string
          description: The ship's name (D-055); "<ship type name> <id>" until `rename_ship` renames it.
        state:
          type: string
          enum: [idle, on_route, manual_leg, waiting_for_berth, anchored_unpaid, on_world_map]
        island_id:
          type: string
          description: Island where the ship is; empty while travelling or at sea.
        position:
          nullable: true
          description: Archipelago position of an idle or anchored ship at sea (the start ship of a new world, D-051); null at an island or on a leg.
          allOf:
            - $ref: "#/components/schemas/SeaPosition"
        route_id:
          type: integer
          format: int64
          description: Assigned route ID; 0 when none (unscaled identifier).
        stop_index:
          type: integer
          description: Index of the route stop the ship heads to (0-based count).
        leg:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/LegDisplay"
        cargo:
          type: array
          description: Occupied cargo slots (a good may occupy several slots).
          items:
            $ref: "#/components/schemas/CargoDisplay"
        slots:
          type: integer
          description: Cargo slots of the ship type (count).
        slot_size:
          type: integer
          format: int64
          description: Capacity of one slot (milli-units).
        upkeep_per_min:
          type: integer
          format: int64
          description: Current upkeep (milli-gold per minute; 0 while paused).
        paused:
          type: boolean
        paused_reason:
          type: string
          enum: ["", unpaid]
          description: Empty when not paused.
        queued_at:
          type: string
          nullable: true
          description: When the ship joined the berth queue (RFC 3339, UTC, ms); null unless waiting_for_berth. The queue is FIFO by this time, then ship ID.
        berth_until:
          type: string
          nullable: true
          description: End of the ship's handling at a berth of `island_id` (RFC 3339, UTC, ms) — the departure of a route ship, the end of unloading after a manual leg; null when it holds no berth.
    SeaPosition:
      type: object
      additionalProperties: false
      required: [x, y]
      description: A position at sea.
      properties:
        x:
          type: integer
          description: Column (archipelago tiles).
        y:
          type: integer
          description: Row (archipelago tiles).
    LegDisplay:
      type: object
      additionalProperties: false
      description: The ship handles cargo at the origin until `depart_at` and arrives at `arrive_at`; interpolate linearly in between. A leg from the sea has an empty `from_island_id` and its origin in `from_position`.
      required: [from_island_id, from_position, to_island_id, depart_at, arrive_at]
      properties:
        from_island_id:
          type: string
          description: Origin island; empty for a leg from the sea.
        from_position:
          nullable: true
          description: Origin of a leg from the sea; null for a leg from an island.
          allOf:
            - $ref: "#/components/schemas/SeaPosition"
        to_island_id:
          type: string
        depart_at:
          type: string
          description: Departure (RFC 3339, UTC, ms).
        arrive_at:
          type: string
          description: Arrival, a scheduled ship_arrived (RFC 3339, UTC, ms).
    CargoDisplay:
      type: object
      additionalProperties: false
      required: [good, amount]
      properties:
        good:
          type: string
        amount:
          type: integer
          format: int64
          description: Amount in the slot (milli-units).
    RouteDisplay:
      type: object
      additionalProperties: false
      required: [id, name, stops, ship_ids, loop_ms, effects]
      properties:
        id:
          type: integer
          format: int64
          description: Route ID (unscaled integer identifier, assigned sequentially).
        name:
          type: string
        stops:
          type: array
          items:
            $ref: "#/components/schemas/RouteStopDisplay"
        ship_ids:
          type: array
          description: Assigned ships.
          items:
            type: integer
            format: int64
            description: Ship ID (unscaled integer identifier).
        loop_ms:
          type: integer
          format: int64
          description: Duration of one loop at reference speed 1.0 (ms) — the handling time of every stop plus the travel time of every leg.
        effects:
          type: array
          description: >-
            Estimated net effect of the route per island and good (display
            only; stock availability ignored). Per good, the stops are walked
            twice from stop 0 with an empty virtual hold H (the smallest
            slots × slot_size among the assigned ships, else among the
            catalogue's ship types); a stop first unloads the good aboard,
            then tops it up to min(max_amount, H). The sums of the second
            pass are per_loop. Sorted by the first stop of the island, then
            by good; pairs with per_loop 0 are omitted; [] when the route
            moves nothing.
          items:
            $ref: "#/components/schemas/RouteEffectDisplay"
    RouteEffectDisplay:
      type: object
      additionalProperties: false
      required: [island_id, good, per_loop, per_min]
      properties:
        island_id:
          type: string
        good:
          type: string
          description: Content good ID.
        per_loop:
          type: integer
          format: int64
          description: Signed net change per loop (milli-units); positive when the island gains the good.
        per_min:
          type: integer
          format: int64
          description: Signed net change per minute (milli-units) with all assigned ships — per_loop × assigned ships × 60000 / loop_ms, truncated toward zero; 0 when no ship is assigned or loop_ms is 0.
    RouteStopDisplay:
      type: object
      additionalProperties: false
      required: [island_id, load, unload]
      properties:
        island_id:
          type: string
        load:
          type: array
          items:
            $ref: "#/components/schemas/LoadRule"
        unload:
          type: array
          items:
            type: string
    ShipOrderDisplay:
      type: object
      additionalProperties: false
      required: [type, ordered_at, due_at]
      properties:
        type:
          type: string
          description: Content ship ID.
        ordered_at:
          type: string
          description: Order time (RFC 3339, UTC, ms).
        due_at:
          type: string
          description: The ship is built at this time, a scheduled ship_built (RFC 3339, UTC, ms).
    TierDisplay:
      type: object
      additionalProperties: false
      required: [id, unlocked, population, buildings]
      properties:
        id:
          type: string
        unlocked:
          type: boolean
        population:
          type: object
          description: Population unlock conditions keyed by tier ID.
          additionalProperties:
            $ref: "#/components/schemas/PopulationDisplay"
        buildings:
          type: object
          description: Building unlock conditions keyed by building ID (true = built).
          additionalProperties:
            type: boolean
    PopulationDisplay:
      type: object
      additionalProperties: false
      required: [have, need]
      properties:
        have:
          type: integer
          format: int64
          description: Residents of the tier in the archipelago (milli-residents).
        need:
          type: integer
          format: int64
          description: Residents required (milli-residents).
    ArchipelagoDisplay:
      type: object
      additionalProperties: false
      description: The generated archipelago (D-053).
      required: [seed, roll, rerollable, bounds]
      properties:
        seed:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: World seed (53 bits); 0 for a hand-made archipelago.
        roll:
          type: integer
          minimum: 0
          description: Number of rerolls; seed and roll identify the archipelago.
        rerollable:
          type: boolean
          description: "`reroll_archipelago` is allowed: a generated archipelago, no island settled, no ship under way."
        bounds:
          type: object
          additionalProperties: false
          required: [x, y, width, height]
          description: Bounding box of the islands (archipelago tiles).
          properties:
            x:
              type: integer
              description: Left column (archipelago tiles).
            y:
              type: integer
              description: Top row (archipelago tiles).
            width:
              type: integer
              description: Columns (archipelago tiles).
            height:
              type: integer
              description: Rows (archipelago tiles).
    IslandDisplay:
      type: object
      additionalProperties: false
      required: [id, name, size_class, rock, settled, position, width, height, inventory, roads, buildings, workforce, population, capacity_source, fertilities, deposits, terrain_mask]
      properties:
        id:
          type: string
        name:
          type: string
          description: Display name (may be empty); generated islands draw it from the region's word list, `rename_island` renames a settled one.
        size_class:
          type: string
          description: Content size class of a generated island (`islands.json`), "" for a hand-made one.
        rock:
          type: boolean
          description: The island is a resource rock (mines only, no houses).
        settled:
          type: boolean
          description: The island has a Trading Post (capacity > 0); unsettled islands accept only found_island.
        position:
          type: object
          additionalProperties: false
          required: [x, y]
          description: Archipelago position.
          properties:
            x:
              type: integer
              description: Column (archipelago tiles).
            y:
              type: integer
              description: Row (archipelago tiles).
        width:
          type: integer
          description: Columns (tiles).
        height:
          type: integer
          description: Rows (tiles).
        inventory:
          type: object
          description: Island inventory keyed by good ID (every good of the content).
          additionalProperties:
            $ref: "#/components/schemas/GoodDisplay"
        roads:
          type: array
          items:
            $ref: "#/components/schemas/RoadDisplay"
        buildings:
          type: array
          description: Buildings by ascending ID.
          items:
            $ref: "#/components/schemas/BuildingDisplay"
        workforce:
          type: object
          description: Workforce pool keyed by tier ID.
          additionalProperties:
            $ref: "#/components/schemas/WorkforceDisplay"
        population:
          type: object
          description: Residents keyed by tier ID (milli-residents).
          additionalProperties:
            type: integer
            format: int64
            description: Residents (milli-residents).
        capacity_source:
          nullable: true
          description: The building that sets the island's capacity per good (the Trading Post, D-051); null when the island is not settled (capacity 0). Warehouses never add capacity.
          allOf:
            - $ref: "#/components/schemas/CapacitySourceDisplay"
        fertilities:
          type: array
          description: |
            Island-wide fertility tags (MECHANICS §2); a building whose
            `work_area.fertility` is missing here cannot be placed
            (`no_fertility`).
          items:
            type: string
        deposits:
          type: array
          description: |
            Tiles carrying a deposit, sorted by tile index (y × width + x).
            A building with `requires_deposit` must cover at least one tile
            of its kind (`no_deposit`) and may stand on mountain tiles.
          items:
            $ref: "#/components/schemas/DepositDisplay"
        terrain_mask:
          type: string
          description: |
            The terrain downsampled 1:4 for the far view and the minimap:
            one character per 4 × 4 block of tiles, row-major over
            ceil(width / 4) × ceil(height / 4) blocks, the block's majority
            terrain — `w` water, `c` coast, `m` mountain, `f` forest, `g`
            grass; ties go to the earlier letter in that order (water wins
            every tie); edge blocks count only the tiles inside the island.
            The full rows: `GET /api/v1/world/islands/{island_id}/tiles`.
          pattern: "^[wcmfg]*$"
    CapacitySourceDisplay:
      type: object
      additionalProperties: false
      required: [building_id, type, level, capacity]
      properties:
        building_id:
          type: integer
          format: int64
          description: Building ID of the Trading Post (unscaled integer identifier).
        type:
          type: string
          description: Content building ID.
        level:
          type: integer
          description: Trading Post level (1-based).
        capacity:
          type: integer
          format: int64
          description: Capacity per good at that level (milli-units).
    GoodDisplay:
      type: object
      additionalProperties: false
      required: [stock, capacity, in_transit, rate_per_min]
      properties:
        stock:
          type: integer
          format: int64
          description: Stock (milli-units).
        capacity:
          type: integer
          format: int64
          description: Capacity (milli-units).
        in_transit:
          type: integer
          format: int64
          description: Goods on the road to a collector (milli-units).
        rate_per_min:
          type: integer
          format: int64
          description: Net stock rate, arrivals minus consumption (milli-units per minute, signed).
    WorkforceDisplay:
      type: object
      additionalProperties: false
      required: [available, required, factor_permille]
      properties:
        available:
          type: integer
          format: int64
          description: Workers available (milli-residents).
        required:
          type: integer
          format: int64
          description: Workers required by producers (milli-residents).
        factor_permille:
          type: integer
          format: int64
          description: Workforce factor min(1, available/required) (permille).
    RoadDisplay:
      type: object
      additionalProperties: false
      required: [x, y, type]
      properties:
        x:
          type: integer
          description: Column (tiles).
        y:
          type: integer
          description: Row (tiles).
        type:
          type: string
          description: Content building ID of the road type.
    RatesDisplay:
      type: object
      additionalProperties: false
      required: [inputs, outputs]
      properties:
        inputs:
          type: object
          description: Consumption per input good (milli-units per minute).
          additionalProperties:
            type: integer
            format: int64
            description: Consumption (milli-units per minute).
        outputs:
          type: object
          description: Production per output good (milli-units per minute).
          additionalProperties:
            type: integer
            format: int64
            description: Production (milli-units per minute).
    BufferDisplay:
      type: object
      additionalProperties: false
      required: [stock, capacity]
      properties:
        stock:
          type: object
          description: Buffered output per good (milli-units).
          additionalProperties:
            type: integer
            format: int64
            description: Buffered amount (milli-units).
        capacity:
          type: integer
          format: int64
          description: Buffer capacity per good (milli-units).
    BuildingWorkforce:
      type: object
      additionalProperties: false
      required: [tier, required]
      properties:
        tier:
          type: string
        required:
          type: integer
          format: int64
          description: Workers required (milli-residents).
    NeedDisplay:
      type: object
      additionalProperties: false
      required: [id, kind, fulfilment_permille, reason]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [required, optional]
        category:
          type: string
          description: Goods needs only.
        building:
          type: string
          description: The public building of a building need with a single alternative (content building ID); absent for goods needs and services categories.
        fulfilment_permille:
          type: integer
          format: int64
          description: Fulfilment (permille).
        reason:
          type: string
          enum: [ok, short_supply, no_supply, out_of_range, not_connected, paused]
        goods:
          type: object
          description: Island-wide consumption of the tier's houses per acceptable good (milli-units per minute).
          additionalProperties:
            type: integer
            format: int64
            description: Consumption (milli-units per minute).
    BuildingDisplay:
      type: object
      additionalProperties: false
      description: |
        A building. Producer fields are present for buildings with a
        recipe, collector fields (`level`, `throughput_per_min`,
        `load_permille`) for the Trading Post and Warehouses, `capacity`
        and `berths` for the Trading Post only (D-051), house fields for
        houses, `fields` for farms with fields and `farm_id` for assigned
        fields (D-049).
      required:
        [id, type, x, y, rotation, paused, paused_reason, status, efficiency_permille, throughput_factor_permille]
      properties:
        id:
          type: integer
          format: int64
          description: Building ID (unscaled integer identifier, unique per world, assigned sequentially).
        type:
          type: string
          description: Content building ID.
        x:
          type: integer
          description: Left column of the rotated footprint (tiles).
        y:
          type: integer
          description: Top row of the rotated footprint (tiles).
        rotation:
          type: integer
          enum: [0, 90, 180, 270]
          description: Degrees.
        paused:
          type: boolean
        paused_reason:
          type: string
          enum: ["", player, unpaid]
          description: Empty when not paused.
        status:
          type: string
          enum: [paused, not_connected, warehouse_full, input_starved, throttled, short_of_workers, low_efficiency, not_adjacent, ok]
          description: |
            Primary status (MECHANICS §14). `not_adjacent`: a field whose
            chain to its farm is broken (inactive; fields are otherwise
            `ok`).
        efficiency_permille:
          type: integer
          format: int64
          description: |
            Work-area efficiency (permille; 1000 without work area). For a
            farm with fields min(1000, active × 1000 / required).
        throughput_factor_permille:
          type: integer
          format: int64
          description: Collector throughput factor (permille).
        status_goods:
          type: array
          description: Goods behind the status, sorted by ID; starve-limited inputs for input_starved, full outputs for warehouse_full.
          items:
            type: string
        rates:
          $ref: "#/components/schemas/RatesDisplay"
        cycle_seconds:
          type: number
          description: Nominal cycle length at 100 % (seconds).
        cycle_progress_permille:
          type: integer
          format: int64
          description: Progress of the current cycle (permille, 0–999).
        transfer_delay_ms:
          type: integer
          format: int64
          description: Delivery latency to the assigned collector (ms).
        assigned_warehouse_id:
          type: integer
          format: int64
          description: Building ID of the assigned collector (the Trading Post or a Warehouse, nearest by road); 0 when not connected.
        road_distance:
          type: integer
          description: Road distance to the assigned collector (tiles).
        buffer:
          $ref: "#/components/schemas/BufferDisplay"
        cycle_rate_permille_per_min:
          type: integer
          format: int64
          description: Cycle progress per minute at the current rate (permille per minute); absent when 0.
        workforce_factor_permille:
          type: integer
          format: int64
          description: Workforce factor of the producer (permille).
        workforce:
          $ref: "#/components/schemas/BuildingWorkforce"
        level:
          type: integer
          description: Trading Post, Warehouse or levelled public building level (1-based).
        capacity:
          type: integer
          format: int64
          description: Trading Post only — the island's capacity per good at this level (milli-units).
        throughput_per_min:
          type: integer
          format: int64
          description: Collector throughput of the Trading Post or Warehouse (milli-units per minute).
        load_permille:
          type: integer
          format: int64
          description: Collector load R/T of the producers assigned to it (permille; above 1000 = overloaded).
        berths:
          type: object
          additionalProperties: false
          required: [total, busy, ships, queue]
          description: Trading Post only — its pier (MECHANICS §9.3).
          properties:
            total:
              type: integer
              description: Berths at the current level (count).
            busy:
              type: integer
              description: Berths held by a handling ship (count).
            ships:
              type: array
              description: Ship IDs holding a berth (ascending; unscaled identifiers).
              items:
                type: integer
                format: int64
                description: Ship ID (unscaled identifier).
            queue:
              type: array
              description: Ship IDs waiting for a berth in FIFO order (unscaled identifiers).
              items:
                type: integer
                format: int64
                description: Ship ID (unscaled identifier).
        residents:
          type: integer
          format: int64
          description: Residents (milli-residents, whole residents).
        residents_floor:
          type: integer
          format: int64
          description: Minimum residents of the tier (milli-residents).
        residents_max:
          type: integer
          format: int64
          description: Maximum residents of the tier (milli-residents).
        growth_progress_permille:
          type: integer
          format: int64
          description: Growth accumulator towards the next resident (permille of one resident, −999…999).
        growth_rate_per_min:
          type: integer
          format: int64
          description: Growth (milli-residents per minute, signed); equivalently permille of a resident per minute.
        satisfaction_permille:
          type: integer
          format: int64
          description: Satisfaction (permille).
        tax_rate_per_min:
          type: integer
          format: int64
          description: Taxes of the house (milli-gold per minute).
        needs:
          type: array
          items:
            $ref: "#/components/schemas/NeedDisplay"
        served_by:
          type: array
          description: Houses only, omitted when empty — the IDs (ascending) of the buildings that currently fulfil one of the house's building needs (in range, connected to a warehouse, not paused).
          items:
            type: integer
            format: int64
            description: Building ID (unscaled identifier).
        ship_order:
          nullable: true
          description: Shipyards only (absent for other buildings) — the pending order, or null when the shipyard is idle.
          allOf:
            - $ref: "#/components/schemas/ShipOrderDisplay"
        fields:
          type: object
          additionalProperties: false
          required: [active, required, max, ids]
          description: Farms with fields only (D-051 part 4).
          properties:
            active:
              type: integer
              description: Active fields of this farm (count).
            required:
              type: integer
              description: Active fields for full efficiency (count).
            max:
              type: integer
              description: Most fields the farm may own (count).
            ids:
              type: array
              description: IDs of all fields of the farm, active or not, in ascending order.
              items:
                type: integer
                format: int64
                description: Building ID (unscaled integer identifier).
        farm_id:
          type: integer
          format: int64
          description: Fields only — building ID of the farm the field belongs to.
        active:
          type: boolean
          description: Fields only — whether the chain to the farm is intact; `false` has status `not_adjacent`.
    # ------------------------------------------------------------------
    # Content payload
    # ------------------------------------------------------------------
    Content:
      type: object
      additionalProperties: false
      required: [region, tiers, goods, buildings, needs, need_categories, ships, quests, size_classes]
      properties:
        region:
          $ref: "#/components/schemas/ContentRegion"
        quests:
          type: array
          description: Quests in content order (a quest is active when its prerequisites are completed).
          items:
            $ref: "#/components/schemas/ContentQuest"
        tiers:
          type: array
          description: Tiers in progression order.
          items:
            $ref: "#/components/schemas/ContentTier"
        goods:
          type: array
          items:
            $ref: "#/components/schemas/ContentGood"
        buildings:
          type: array
          items:
            $ref: "#/components/schemas/ContentBuilding"
        needs:
          type: array
          description: Needs grouped by tier in progression order, file order within a tier.
          items:
            $ref: "#/components/schemas/ContentNeed"
        need_categories:
          type: array
          description: Goods-need categories in content order (display names and HUD icons; a goods need's `category` is one of them).
          items:
            $ref: "#/components/schemas/ContentNeedCategory"
        ships:
          type: array
          description: Ship types (ordered at buildings with a shipyard block).
          items:
            $ref: "#/components/schemas/ContentShip"
        size_classes:
          type: array
          description: Island size classes of the archipelago generator in content order (D-053; the names of an island's `size_class`).
          items:
            $ref: "#/components/schemas/ContentSizeClass"
    ContentSizeClass:
      type: object
      additionalProperties: false
      required: [id, name, rock]
      properties:
        id:
          type: string
        name:
          type: string
          description: Player-facing name, e.g. "Large" or "Resource rock".
        rock:
          type: boolean
          description: Resource rocks carry mines only (no fertility, no houses).
    ContentQuest:
      type: object
      additionalProperties: false
      required: [id, title, text, objectives, rewards, prerequisites]
      properties:
        id:
          type: string
        title:
          type: string
        text:
          type: string
          description: Advisor prose shown to the player.
        objectives:
          type: array
          items:
            $ref: "#/components/schemas/ContentObjective"
        rewards:
          $ref: "#/components/schemas/ContentRewards"
        prerequisites:
          type: array
          description: IDs of earlier quests that must be completed first.
          items:
            type: string
    ContentObjective:
      type: object
      additionalProperties: false
      description: An objective; `target` in the unit of `ObjectiveDisplay`.
      required: [kind, target]
      properties:
        kind:
          type: string
          enum: [building_count, connected, population, stock, route_exists, island_settled, tier_unlocked, ship_count, satisfaction]
        type:
          type: string
          description: Content building ID (building_count, connected).
        good:
          type: string
          description: Good ID (stock).
        tier:
          type: string
          description: Tier ID (population, tier_unlocked, satisfaction).
        island:
          type: string
          description: Island the objective is restricted to (absent = archipelago).
        target:
          type: integer
          format: int64
          description: Target value (count, 1 for yes/no predicates, milli-residents, milli-units or per-mille; see ObjectiveDisplay).
    ContentRewards:
      type: object
      additionalProperties: false
      required: [gold, goods]
      properties:
        gold:
          type: integer
          format: int64
          minimum: 0
          description: Reward gold (milli-gold).
        goods:
          type: object
          description: Reward goods by good ID (milli-units), credited to the chosen island up to its free capacity.
          additionalProperties:
            type: integer
            format: int64
            description: Amount (milli-units).
    ContentShip:
      type: object
      additionalProperties: false
      required: [id, name, tier, slots, slot_size, speed_permille, build_ms, cost, upkeep_per_min]
      properties:
        id:
          type: string
        name:
          type: string
        tier:
          type: string
        slots:
          type: integer
          description: Cargo slots (count).
        slot_size:
          type: integer
          format: int64
          description: Capacity of one slot (milli-units).
        speed_permille:
          type: integer
          format: int64
          description: Speed factor (permille; 1000 = reference speed).
        build_ms:
          type: integer
          format: int64
          description: Build time at the shipyard (ms).
        cost:
          type: object
          additionalProperties: false
          required: [gold, materials]
          properties:
            gold:
              type: integer
              format: int64
              description: Gold cost (milli-gold).
            materials:
              type: object
              description: Material cost per good (milli-units).
              additionalProperties:
                type: integer
                format: int64
                description: Amount (milli-units).
        upkeep_per_min:
          type: integer
          format: int64
          description: Upkeep (milli-gold per minute).
    ContentRegion:
      type: object
      additionalProperties: false
      required: [id, name, version, rules, camera]
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
          description: Content version (e.g. old_coast-0.3.0).
        rules:
          $ref: "#/components/schemas/ContentRules"
        camera:
          type: object
          additionalProperties: false
          required: [max_half_extent]
          description: Client view constants of the region (render only, no rule reads them).
          properties:
            max_half_extent:
              type: integer
              description: Largest camera half-extent in tiles (the zoom-out cap); clients never cap below their far-LOD reach.
    ContentRules:
      type: object
      additionalProperties: false
      required:
        [transfer_base_ms, unconnected_buffer, iteration_cap, coarse_step_ms, growth_per_min, decline_per_min, growth_satisfaction_threshold, auto_resume_upkeep_ms, ship_handling_base_ms, ship_handling_ms_per_unit, ship_speed_milli_tiles_per_min, away_summary_ms, trial_resume_upkeep_ms]
      properties:
        transfer_base_ms:
          type: integer
          format: int64
          description: Base delivery latency (ms).
        unconnected_buffer:
          type: integer
          format: int64
          description: Output buffer of an unconnected producer per good (milli-units).
        iteration_cap:
          type: integer
          description: Boundaries per advancement before coarse steps (count).
        coarse_step_ms:
          type: integer
          format: int64
          description: Coarse step length (ms).
        growth_per_min:
          type: integer
          format: int64
          description: House growth at full satisfaction (milli-residents per minute).
        decline_per_min:
          type: integer
          format: int64
          description: House decline factor (milli-residents per minute).
        growth_satisfaction_threshold:
          type: integer
          format: int64
          description: Satisfaction from which houses grow (ppm).
        auto_resume_upkeep_ms:
          type: integer
          format: int64
          description: Gold reserve for auto-resume, as a duration of the building's or ship's upkeep (ms).
        ship_handling_base_ms:
          type: integer
          format: int64
          description: Fixed part of the time a ship occupies a berth to unload and load (ms).
        ship_handling_ms_per_unit:
          type: integer
          format: int64
          description: Additional handling time per unit (1000 milli-units) of goods moved at a stop (ms per unit).
        ship_speed_milli_tiles_per_min:
          type: integer
          format: int64
          description: Archipelago distance a ship of speed 1.0 covers per minute (milli-tiles per minute).
        away_summary_ms:
          type: integer
          format: int64
          description: Minimum world time since the last command before a request produces a "while you were away" summary (ms).
        trial_resume_upkeep_ms:
          type: integer
          format: int64
          description: Trial reserve as a duration of an unpaid building's or ship's upkeep (ms); gold reaching it resumes the candidate although the recomputed balance is negative.
    ContentTier:
      type: object
      additionalProperties: false
      required: [id, name, index, residents_floor, residents_max, tax_per_resident_per_min, house, unlock]
      properties:
        id:
          type: string
        name:
          type: string
        index:
          type: integer
          description: Position in progression order (0 = first tier).
        residents_floor:
          type: integer
          format: int64
          description: Minimum residents per house (milli-residents).
        residents_max:
          type: integer
          format: int64
          description: Maximum residents per house (milli-residents).
        tax_per_resident_per_min:
          type: integer
          format: int64
          description: Tax per resident (milli-gold per minute).
        house:
          type: string
          nullable: true
          description: House building ID; null for a declared-only tier.
        unlock:
          $ref: "#/components/schemas/ContentUnlock"
    ContentUnlock:
      type: object
      additionalProperties: false
      required: [population, buildings]
      properties:
        population:
          type: object
          description: Residents required per earlier tier (milli-residents).
          additionalProperties:
            type: integer
            format: int64
            description: Residents (milli-residents).
        buildings:
          type: array
          items:
            type: string
    ContentGood:
      type: object
      additionalProperties: false
      required: [id, name, type]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
    ContentGoodAmount:
      type: object
      additionalProperties: false
      required: [good, amount]
      properties:
        good:
          type: string
        amount:
          type: integer
          format: int64
          description: Amount per cycle (milli-units).
    ContentBuilding:
      type: object
      additionalProperties: false
      required:
        [id, name, tier, category, width, height, coastal, water_tiles, requires_road, cost, upkeep_per_min, pause_category]
      properties:
        id:
          type: string
        name:
          type: string
        tier:
          type: string
        category:
          type: string
          enum: [houses, production, public, harbour, roads, other]
          description: |
            Build-menu group derived by the server from the capability
            blocks: house → houses, recipe, field or warehouse →
            production, service → public, trading_post or shipyard →
            harbour, road → roads; other for none of these. The Trading
            Post is placed only by `found_island`, never from the build
            menu.
        width:
          type: integer
          description: Footprint width at rotation 0 (tiles).
        height:
          type: integer
          description: Footprint height at rotation 0 (tiles).
        coastal:
          type: boolean
        water_tiles:
          type: integer
          description: |
            Water-edge footprint (D-051): the number of front rows (tiles)
            that must lie on water; at rotation 0 the top rows (smallest
            y), at 90 the rightmost columns, at 180 the bottom rows, at 270
            the leftmost columns. The other rows stand on buildable land.
            0 for every other building.
        requires_road:
          type: boolean
        cost:
          type: object
          additionalProperties: false
          required: [gold, materials]
          properties:
            gold:
              type: integer
              format: int64
              description: Gold cost (milli-gold).
            materials:
              type: object
              description: Material cost per good (milli-units).
              additionalProperties:
                type: integer
                format: int64
                description: Amount (milli-units).
        upkeep_per_min:
          type: integer
          format: int64
          description: Upkeep (milli-gold per minute).
        pause_category:
          type: string
        recipe:
          type: object
          additionalProperties: false
          required: [inputs, outputs, cycle_ms]
          properties:
            inputs:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [good, goods, amount]
                description: |
                  An input slot (D-056 §7): `good` is the preferred good,
                  `goods` every accepted good in preference order (`good`
                  first, e.g. `["charcoal", "coal"]`). The producer draws
                  the first one that is not starved; `rates.inputs` of the
                  building display names the good it draws.
                properties:
                  good:
                    type: string
                  goods:
                    type: array
                    minItems: 1
                    items:
                      type: string
                  amount:
                    type: integer
                    format: int64
                    description: Milli-units per cycle.
            outputs:
              type: array
              items:
                $ref: "#/components/schemas/ContentGoodAmount"
            cycle_ms:
              type: integer
              format: int64
              description: Cycle length at 100 % (ms).
        house:
          type: object
          additionalProperties: false
          required: [tier]
          properties:
            tier:
              type: string
        trading_post:
          type: object
          additionalProperties: false
          required: [levels]
          description: |
            The Trading Post (D-051): one per island, placed by founding;
            its level sets the island's capacity per good, its collector
            throughput and the berths of its pier.
          properties:
            levels:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [capacity, throughput_per_min, berths]
                properties:
                  capacity:
                    type: integer
                    format: int64
                    description: Capacity per good (milli-units).
                  throughput_per_min:
                    type: integer
                    format: int64
                    description: Collector throughput (milli-units per minute).
                  berths:
                    type: integer
                    description: Ships that can load or unload at once (count).
                  cost:
                    type: object
                    additionalProperties: false
                    required: [gold, materials]
                    description: |
                      Upgrade cost into this level (`upgrade_trading_post`);
                      absent on the first level, which the building cost
                      places.
                    properties:
                      gold:
                        type: integer
                        format: int64
                        description: Gold cost (milli-gold).
                      materials:
                        type: object
                        description: Material cost per good (milli-units).
                        additionalProperties:
                          type: integer
                          format: int64
                          description: Amount (milli-units).
        warehouse:
          type: object
          additionalProperties: false
          required: [levels]
          description: |
            An inland collector (D-051): throughput only, never capacity.
          properties:
            levels:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [throughput_per_min]
                properties:
                  throughput_per_min:
                    type: integer
                    format: int64
                    description: Collector throughput (milli-units per minute).
                  cost:
                    type: object
                    additionalProperties: false
                    required: [gold, materials]
                    description: |
                      Upgrade cost into this level (`upgrade_warehouse`);
                      absent on the first level, which the building cost
                      places.
                    properties:
                      gold:
                        type: integer
                        format: int64
                        description: Gold cost (milli-gold).
                      materials:
                        type: object
                        description: Material cost per good (milli-units).
                        additionalProperties:
                          type: integer
                          format: int64
                          description: Amount (milli-units).
        road:
          type: object
          additionalProperties: false
          required: [ms_per_tile]
          properties:
            ms_per_tile:
              type: integer
              format: int64
              description: Transfer time per road tile (ms).
        service:
          type: object
          additionalProperties: false
          required: [radius, levels]
          properties:
            radius:
              type: integer
              description: Service radius at level 1 (tiles).
            levels:
              type: array
              description: Levels in order (D-056); a public building without levels has one. Later levels are reached by `upgrade_building`.
              items:
                type: object
                additionalProperties: false
                required: [radius]
                properties:
                  radius:
                    type: integer
                    description: Service radius (tiles).
                  tier:
                    type: string
                    description: Tier that must be unlocked to upgrade into this level.
                  cost:
                    type: object
                    additionalProperties: false
                    required: [gold, materials]
                    description: |
                      Upgrade cost into this level (`upgrade_building`);
                      absent on the first level, which the building cost
                      places.
                    properties:
                      gold:
                        type: integer
                        format: int64
                        description: Gold cost (milli-gold).
                      materials:
                        type: object
                        description: Material cost per good (milli-units).
                        additionalProperties:
                          type: integer
                          format: int64
                          description: Amount (milli-units).
        work_area:
          type: object
          additionalProperties: false
          description: |
            Work radius. `radius`, `terrain` and `required_tiles` are present
            for the implicit terrain rule (lumberjack) and absent for a farm
            with `fields` (no radius, D-051 part 4), which has at most a
            `fertility`.
          properties:
            radius:
              type: integer
              description: Work-area radius (tiles).
            terrain:
              type: array
              items:
                type: string
            required_tiles:
              type: integer
              description: Matching tiles for full efficiency (count).
            fertility:
              type: string
              description: Island fertility tag the building needs (absent for none).
        workforce:
          type: object
          additionalProperties: false
          required: [tier, amount]
          properties:
            tier:
              type: string
            amount:
              type: integer
              format: int64
              description: Workers required (milli-residents).
        shipyard:
          type: object
          additionalProperties: false
          required: [ships]
          description: Orders ships of the listed types, one at a time.
          properties:
            ships:
              type: array
              items:
                type: string
                description: Content ship ID.
        requires_deposit:
          type: string
          description: |
            Deposit kind the footprint must cover (absent for none); such a
            building may also stand on mountain tiles.
        fields:
          type: object
          additionalProperties: false
          required: [type, required, max]
          description: |
            A farm that needs fields (D-049, D-051 part 4): efficiency =
            min(1, active fields / required). Fields are placed from the
            farm's panel next to the farm or one of its active fields.
          properties:
            type:
              type: string
              description: The farm's one field type (`field.type` of the field building whose `field.farm` is this farm).
            required:
              type: integer
              description: Active fields for full efficiency (count).
            max:
              type: integer
              description: Most fields the farm may own (count).
        field:
          type: object
          additionalProperties: false
          required: [type, farm, terrain]
          description: |
            A field placeable (D-049, D-051 part 4), 1×1 (crop) or 2×2
            (animal): placed with `place_field` from its farm on `terrain`
            (and the island's `fertility`, when set), 4-edge adjacent to the farm
            or to one of its active fields.
          properties:
            type:
              type: string
              description: Field type.
            farm:
              type: string
              description: Building type of the one farm the field belongs to.
            terrain:
              type: array
              items:
                type: string
            fertility:
              type: string
              description: Island fertility tag the field needs (absent for none).
    ContentNeedCategory:
      type: object
      additionalProperties: false
      required: [id, name, icon]
      properties:
        id:
          type: string
        name:
          type: string
          description: Player-facing name (1–32 printable characters).
        icon:
          type: string
          description: HUD icon key (assets/icons/icons.json), e.g. `need:food`.
    ContentNeed:
      type: object
      additionalProperties: false
      required: [id, name, tier, kind, weight]
      properties:
        id:
          type: string
        name:
          type: string
          description: Player-facing name (1–32 printable characters), e.g. "Food" or "Market".
        tier:
          type: string
        from_tier:
          type: string
          description: Set on a lower tier's goods category carried by this tier (cumulative tiers, D-056).
        kind:
          type: string
          enum: [required, optional]
        weight:
          type: integer
          format: int64
          description: Satisfaction weight (ppm, normalised; own-tier categories share 0.6 when the tier carries lower-tier categories).
        category:
          type: string
          description: Goods needs only.
        goods:
          type: array
          description: Goods needs only.
          items:
            type: object
            additionalProperties: false
            required: [good, per_resident_per_min, share]
            properties:
              good:
                type: string
              per_resident_per_min:
                type: integer
                format: int64
                description: Consumption per resident (micro-units per minute).
              share:
                type: integer
                format: int64
                description: Coverage of the category at full supply of this good (ppm, D-056).
        buildings:
          type: array
          description: Building (services) needs only (D-056) — the public buildings that serve the house within the radius of their level.
          items:
            type: object
            additionalProperties: false
            required: [building, share]
            properties:
              building:
                type: string
                description: Content building ID.
              share:
                type: integer
                format: int64
                description: Coverage when the building serves the house (ppm).
